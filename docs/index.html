<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>전시연계프로그램 &lt;ON AIR: 규칙을 찾아라!&gt; 감상평 다이어리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="mainView" class="screen">
    <div class="main-center">
      <h1 class="main-title">
        <span class="main-eyebrow">전시연계프로그램</span>
        <span class="main-program">&lt;ON AIR: 규칙을 찾아라!&gt;</span>
        <span class="main-name">감상평 다이어리</span>
      </h1>
      <div class="main-menu">
        <button type="button" class="menu-btn" id="btnWrite">
          <span class="menu-btn-icon">✏️</span>
          <span class="menu-btn-label">일기 쓰기</span>
        </button>
        <button type="button" class="menu-btn" id="btnRead">
          <span class="menu-btn-icon">📖</span>
          <span class="menu-btn-label">일기 읽기</span>
        </button>
      </div>
    </div>
  </div>

  <div id="passwordView" class="screen hidden">
    <div class="sub-header">
      <button type="button" class="btn-icon" id="btnBackPassword">←</button>
      <span class="sub-title">일기 쓰기</span>
    </div>
    <form id="passwordForm" class="password-form">
      <p class="password-desc">작성하려면 비밀번호를 입력해 주세요</p>
      <label class="field">
        <span class="field-label">비밀번호</span>
        <input type="password" id="inputPassword" inputmode="numeric" maxlength="10" autocomplete="off" required>
      </label>
      <button type="submit" class="btn-primary">확인</button>
    </form>
  </div>

  <div id="adminPasswordView" class="screen hidden">
    <div class="sub-header">
      <button type="button" class="btn-icon" id="btnBackAdminPassword">←</button>
      <span class="sub-title">관리자</span>
    </div>
    <form id="adminPasswordForm" class="password-form">
      <p class="password-desc">관리자 비밀번호를 입력해 주세요</p>
      <label class="field">
        <span class="field-label">비밀번호</span>
        <input type="password" id="inputAdminPassword" inputmode="numeric" maxlength="10" autocomplete="off" required>
      </label>
      <button type="submit" class="btn-primary">확인</button>
    </form>
  </div>

  <div id="adminView" class="screen hidden">
    <div class="sub-header">
      <button type="button" class="btn-icon" id="btnBackAdmin">←</button>
      <span class="sub-title">일기 관리</span>
    </div>
    <div class="admin-toolbar">
      <label class="admin-check-all">
        <input type="checkbox" id="adminSelectAll">
        <span>전체 선택</span>
      </label>
      <button type="button" class="btn-admin-delete" id="btnAdminDelete" disabled>선택 삭제</button>
    </div>
    <div class="admin-list" id="adminList"></div>
  </div>

  <div id="dateView" class="screen hidden">
    <div class="sub-header">
      <button type="button" class="btn-icon" id="btnBackDate">←</button>
      <span class="sub-title">날짜 선택</span>
    </div>
    <div class="date-list" id="datePickerList"></div>
  </div>

  <div id="writeView" class="screen hidden">
    <div class="sub-header">
      <button type="button" class="btn-icon" id="btnBackWrite">←</button>
      <span class="sub-title" id="writeDateLabel"></span>
    </div>
    <form id="diaryForm" class="write-form">
      <label class="field">
        <span class="field-label">이름</span>
        <input type="text" id="inputName" placeholder="이름" maxlength="20" required>
      </label>
      <label class="field">
        <span class="field-label">소감</span>
        <textarea id="inputContent" placeholder="오늘의 감상을 적어주세요" rows="8" maxlength="500" required></textarea>
      </label>
      <div class="field">
        <span class="field-label">만족도</span>
        <div class="emoji-row">
          <button type="button" class="emoji-btn" data-emoji="😢">😢</button>
          <button type="button" class="emoji-btn" data-emoji="😕">😕</button>
          <button type="button" class="emoji-btn" data-emoji="😐">😐</button>
          <button type="button" class="emoji-btn" data-emoji="🙂">🙂</button>
          <button type="button" class="emoji-btn" data-emoji="😊">😊</button>
          <button type="button" class="emoji-btn" data-emoji="🤩">🤩</button>
        </div>
        <input type="hidden" id="inputSatisfaction">
      </div>
      <button type="submit" class="btn-primary" id="btnSubmit">제출하기</button>
    </form>
  </div>

  <div id="bookSelectView" class="screen hidden">
    <div class="sub-header">
      <button type="button" class="btn-icon" id="btnBackBookSelect">←</button>
      <span class="sub-title">책 고르기</span>
    </div>
    <div class="book-shelf" id="bookShelf"></div>
  </div>

  <div id="readView" class="screen hidden">
    <div class="sub-header">
      <button type="button" class="btn-icon" id="btnBackRead">←</button>
      <span class="sub-title" id="readTitle">일기 읽기</span>
    </div>
    <section class="book-area">
      <div class="book-wrapper">
        <div class="book" id="book">
          <div class="book-shadow"></div>
          <div class="book-spine"></div>
          <div class="book-viewport" id="bookViewport">
            <div class="book-track" id="bookTrack"></div>
          </div>
        </div>
      </div>
      <div class="book-controls">
        <button type="button" class="book-nav" id="btnBookPrev">‹</button>
        <span class="book-page-num" id="bookPageNum">1 / 1</span>
        <button type="button" class="book-nav" id="btnBookNext">›</button>
      </div>
      <p class="book-hint">좌우로 넘겨 일기를 읽어보세요</p>
    </section>
  </div>

  <button type="button" class="admin-fab" id="btnAdmin" aria-label="관리자">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.6.24-1.14.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.68.22l2.39-.96c.49.39 1.03.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.6-.24 1.14-.55 1.63-.94l2.39.96c.25.12.54.02.68-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/>
    </svg>
  </button>

  <div id="toast" class="toast hidden"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
